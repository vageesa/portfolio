<!DOCTYPE html>
<html lang="en" style="background-color: #0a0a0c;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Studio | Visual Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600&family=Oswald:wght@500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .studio-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 24, 0.95);
            border: 1px solid var(--border-main);
            padding: 20px;
            border-radius: 8px;
            z-index: 1000;
            width: 320px;
            color: var(--text-main);
            font-family: var(--font-sans);
        }
        .studio-controls h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--accent-primary);
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .control-group input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #0a0a0c;
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 4px;
        }
        .btn-studio {
            width: 100%;
            padding: 10px;
            background: var(--accent-primary);
            color: #000;
            border: none;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: var(--transition-fast);
        }
        .btn-studio:hover {
            background: #fff;
        }
        #json-output {
            width: 100%;
            height: 150px;
            background: #0a0a0c;
            color: var(--accent-secondary);
            border: 1px solid var(--border-main);
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            resize: vertical;
        }
        
        /* Floating Editor Menu for Selected Sticker */
        #sticker-editor {
            position: fixed;
            background: rgba(20, 20, 24, 0.95);
            border: 1px solid var(--accent-secondary);
            padding: 15px;
            border-radius: 8px;
            z-index: 1001;
            display: none;
            color: var(--text-main);
            font-family: var(--font-sans);
            width: 250px;
        }
        #sticker-editor input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        #sticker-editor button {
            margin-top: 10px;
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
        }
        
        /* Override body for studio */
        body.studio-mode {
            overflow: hidden;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        #studio-canvas {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
        }
        .studio-instruction {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 1.2rem;
            pointer-events: none;
        }
    </style>
</head>
<body class="hobby-mode studio-mode">
    <div class="noise-overlay"></div>
    <div class="custom-cursor"></div>
    
    <div id="studio-canvas"></div>
    
    <div class="studio-instruction">
        DRAG TO MOVE // SCROLL TO RESIZE // CLICK TO EDIT
    </div>

    <div class="studio-controls">
        <h2>Sticker Studio</h2>
        <div class="control-group">
            <label>Add New Sticker (PNG/SVG)</label>
            <input type="file" id="upload-sticker" accept=".png, .jpg, .svg, .webp">
        </div>
        <button id="btn-export" class="btn-studio">Export JSON Configuration</button>
        <textarea id="json-output" readonly placeholder="Click export to generate JSON for Sveltia CMS..."></textarea>
    </div>

    <div id="sticker-editor">
        <div style="font-weight:bold; margin-bottom:10px; color:var(--accent-secondary)">Edit Sticker</div>
        <div class="control-group">
            <label>Hover Opacity: <span id="val-opacity">1.0</span></label>
            <input type="range" id="slider-opacity" min="0.1" max="1.0" step="0.05" value="1.0">
        </div>
        <div class="control-group">
            <label>Rotation: <span id="val-rotation">0deg</span></label>
            <input type="range" id="slider-rotation" min="-180" max="180" step="1" value="0">
        </div>
        <button id="btn-delete-sticker">Remove Sticker</button>
    </div>

    <script src="studio.js"></script>
</body>
</html>
